
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS STYLES (MATCHING PREVIOUS DESIGN) --- */
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            background: linear-gradient(-45deg, #000000, #1a0500, #3d0e00, #521500, #701d00);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- CLOCK PANEL --- */
        .clock-panel {
            position: absolute;
            top: 30px; left: 40px;
            text-align: left;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px rgba(255, 100, 0, 0.6);
            animation: fadeInDown 1s ease-out;
            z-index: 10;
        }

        .time { font-size: 3rem; font-weight: 700; letter-spacing: 3px; color: #ff6600; line-height: 1; }
        .date { font-size: 1rem; color: #c77d63; margin-top: 5px; letter-spacing: 2px; text-transform: uppercase; }

        /* --- CARD --- */
        .info-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 69, 0, 0.2);
            border-top: 1px solid rgba(255, 69, 0, 0.5);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 1), inset 0 0 30px rgba(0, 0, 0, 0.9);
            text-align: center;
            width: 400px; /* Slightly wider for the text */
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 1), 0 0 30px rgba(255, 69, 0, 0.3);
            border-color: rgba(255, 69, 0, 0.6);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* --- STATUS TEXT PARAGRAPH --- */
        .status-text {
            font-size: 18px;
            color: #ffaa00; /* Orange Warning Color */
            margin-bottom: 35px;
            line-height: 1.5;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 100, 0, 0.3);
        }

        /* --- BUTTON --- */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #ff3c00, #ff0080);
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 60, 0, 0.7), 0 0 60px rgba(255, 0, 128, 0.4);
            position: relative;
            overflow: hidden;
            animation: buttonPulse 2s infinite;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 60, 0, 1), 0 0 80px rgba(255, 0, 128, 0.8);
            background: linear-gradient(90deg, #ff5e00, #ff00aa);
        }

        @keyframes buttonPulse {
            0% { box-shadow: 0 0 20px rgba(255, 60, 0, 0.7), 0 0 40px rgba(255, 0, 128, 0.2); }
            50% { box-shadow: 0 0 30px rgba(255, 60, 0, 0.9), 0 0 60px rgba(255, 0, 128, 0.6); }
            100% { box-shadow: 0 0 20px rgba(255, 60, 0, 0.7), 0 0 40px rgba(255, 0, 128, 0.2); }
        }

        /* --- WATERMARK --- */
        .watermark {
            position: fixed; bottom: 20px; right: 30px;
            font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; color: #ffaa00;
            letter-spacing: 2px; text-transform: uppercase; pointer-events: none;
            padding-bottom: 5px; text-shadow: 0 0 10px rgba(255, 100, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.6);
            border-bottom: 2px solid rgba(255, 165, 0, 0.8);
            animation: watermarkFlicker 4s infinite alternate;
        }

        @keyframes watermarkFlicker {
            0% { opacity: 0.8; text-shadow: 0 0 10px rgba(255, 100, 0, 0.8); }
            100% { opacity: 1; text-shadow: 0 0 20px rgba(255, 165, 0, 1), 0 0 30px #ff4500; }
        }
        
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body onload="startTime()">

    <div class="clock-panel">
        <div class="time" id="clock">00:00:00</div>
        <div class="date" id="date">Loading Date...</div>
    </div>

    <div class="info-card">
        <h1>SYSTEM NOTICE</h1>
        
        <p class="status-text">
            THE PASSWORD IS CURRENTLY NOT WORKING
        </p>
        
        <button onclick="goToHome()">GO TO THE HOME PAGE</button>
    </div>

    <div class="watermark">Created by Saptarshi Basak</div>

    <script>
        // --- CONFIGURATION ---
        const TARGET_URL = "home.html"; // Where the button sends you

        // --- BUTTON LOGIC ---
        function goToHome() {
            window.location.href = TARGET_URL;
        }

        // --- CLOCK ---
        function startTime() {
            const today = new Date();
            let h = today.getHours(); let m = today.getMinutes(); let s = today.getSeconds();
            let session = "AM";
            if(h == 0){ h = 12; }
            if(h > 12){ h = h - 12; session = "PM"; }
            m = (m < 10) ? "0" + m : m;
            s = (s < 10) ? "0" + s : s;
            document.getElementById('clock').innerHTML = h + ":" + m + ":" + s + " <span style='font-size: 1.5rem'>" + session + "</span>";
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerHTML = today.toLocaleDateString("en-US", options);
            setTimeout(startTime, 1000);
        }
    </script>
</body>
</html>
